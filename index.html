<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="喂养记录">
<title>喂养记录</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* 首屏前应用主题，避免深色模式闪烁 */
(function(){
  try{
    var t = localStorage.getItem('bf_theme');
    var isNight = (function(){ var h=new Date().getHours(); return (h<7||h>=19); })();
    var dark = (t==='dark') || (!t && isNight);
    var el = document.documentElement;
    if(t==='dark' || t==='light') el.setAttribute('data-theme', t);
    else if(dark) el.setAttribute('data-theme','dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    var st = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if(dark){ if(meta) meta.setAttribute('content','#1f1a17'); if(st) st.setAttribute('content','black'); }
    else { if(meta) meta.setAttribute('content','#fff5f3'); if(st) st.setAttribute('content','default'); }
    /* 同步安卓原生状态栏/导航栏颜色：明亮模式=背景色+深色图标；深色模式=暖黑底+浅色图标 */
    try{
      var ab = window.AndroidBridge;
      if(ab && typeof ab.setBarColors === 'function'){
        if(dark) ab.setBarColors('#1f1a17','#1f1a17', false);
        else ab.setBarColors('#fff5f3','#fff5f3', true);
      }
    }catch(e2){}
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#fff5f3; --card:#ffffff; --ink:#3a2e2e; --sub:#9a8a8a;
    --accent:#ff7088; --accent-d:#f2516c; --line:#f1e3df;
    --L:#5b8def; --R:#ff7eb3; --B:#9b6dd6; --BT:#3bb6a0;
    --shadow:0 8px 24px rgba(255,112,136,.12);
    --radius:22px;
    --accent-soft:rgba(255,112,136,.08);
    --timer-grad:linear-gradient(160deg,var(--accent),var(--accent-d));
    --timer-ink:#fff; --timer-border:transparent;
  }
  /* 手动选择深色或跟随系统时的深色配色：降低整体亮度、柔化强调色，护眼 */
  :root[data-theme="dark"]{
    --bg:#1f1a17; --card:#2a231f; --ink:#ece3da; --sub:#a3948b;
    --line:#3b322c; --shadow:0 8px 24px rgba(0,0,0,.5);
    --accent:#e0a96d; --accent-d:#cf8f50;
    --L:#88afc9; --R:#d99c7c; --B:#b48ac4; --BT:#7fb89a;
    --accent-soft:rgba(224,169,109,.12);
    --timer-grad:linear-gradient(160deg,#2a201b,#1f1a17); --timer-ink:#ece3da; --timer-border:var(--line);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1f1a17; --card:#2a231f; --ink:#ece3da; --sub:#a3948b;
      --line:#3b322c; --shadow:0 8px 24px rgba(0,0,0,.5);
      --accent:#e0a96d; --accent-d:#cf8f50;
      --L:#88afc9; --R:#d99c7c; --B:#b48ac4; --BT:#7fb89a;
      --accent-soft:rgba(224,169,109,.12);
      --timer-grad:linear-gradient(160deg,#2a201b,#1f1a17); --timer-ink:#ece3da; --timer-border:var(--line);
    }
  }
  /* 深色模式：温馨暖色调（暖棕底 + 奶油字 + 暖琥珀强调），弱光下柔和护眼 */
  :root[data-theme="dark"] .badge{color:#fbf6f0;}
  :root[data-theme="dark"] .side{background:rgba(236,227,218,.08);color:#ece3da;border-color:rgba(236,227,218,.25);}
  :root[data-theme="dark"] .side.on{background:var(--accent);color:#241c16;border-color:var(--accent);}
  :root[data-theme="dark"] .mainbtn{background:var(--accent);color:#241c16;border:1px solid var(--accent);box-shadow:none;}
  :root[data-theme="dark"] .subbtn{background:rgba(236,227,218,.10);color:#ece3da;border-color:rgba(236,227,218,.3);}
  :root[data-theme="dark"] .subbtn.stop{background:rgba(224,169,109,.16);color:#ece3da;border-color:var(--accent);}
  :root[data-theme="dark"] .iconbtn.bottle{background:rgba(236,227,218,.08);color:#ece3da;border:1px solid var(--line);}
  :root[data-theme="dark"] .seg button.on{background:var(--accent);color:#241c16;border-color:var(--accent);}
  :root[data-theme="dark"] .btn-ok{background:var(--accent);color:#241c16;}
  :root[data-theme="dark"] .btn-danger{background:#b9584f;color:#fbf6f0;}
  :root[data-theme="dark"] .witem.on{color:var(--accent);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 88px;}
  header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 16px;}
  header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.5px;}
  header .sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .topbtns{display:flex;gap:8px;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    border-radius:14px;padding:9px 14px;font-size:14px;font-weight:600;
    box-shadow:var(--shadow);cursor:pointer;white-space:nowrap;
  }
  .iconbtn.bottle{background:linear-gradient(160deg,var(--BT),#2a9b88);color:#fff;}
  /* timer card */
  .timer{
    background:var(--timer-grad);
    border-radius:var(--radius);padding:22px 20px 24px;color:var(--timer-ink);
    border:1px solid var(--timer-border);
    box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;
  }
  .timer .label{font-size:13px;opacity:.9;}
  .clock{font-size:54px;font-weight:800;letter-spacing:1px;margin:8px 0 4px;font-variant-numeric:tabular-nums;}
  .last{font-size:13px;opacity:.92;min-height:18px;}
  .sides{display:flex;gap:10px;justify-content:center;margin:18px 0 20px;}
  .side{
    flex:1;max-width:130px;border:2px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.12);color:#fff;border-radius:16px;
    padding:12px 0;font-size:15px;font-weight:700;cursor:pointer;
    transition:.15s;user-select:none;
  }
  .side small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:2px;}
  .side.on{background:#fff;color:var(--accent-d);border-color:#fff;}
  .timerbtns{margin-top:4px;}
  .mainbtn{
    width:100%;border:none;border-radius:18px;padding:17px 0;font-size:18px;
    font-weight:800;cursor:pointer;background:#fff;color:var(--accent-d);
    box-shadow:0 6px 16px rgba(0,0,0,.12);transition:.12s;
  }
  .mainbtn:active{transform:scale(.98);}
  .mainbtn.stop{background:rgba(0,0,0,.18);color:#fff;}
  .btnrow{display:flex;gap:12px;}
  .subbtn{
    flex:1;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);
    color:#fff;border-radius:18px;padding:18px 0;font-size:18px;font-weight:800;cursor:pointer;transition:.12s;
  }
  .subbtn:active{transform:scale(.98);}
  /* stats */
  .stats{display:flex;gap:12px;margin:18px 0;}
  .stat{flex:1;background:var(--card);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow);}
  .stat .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat .t{font-size:12px;color:var(--sub);margin-top:3px;}
  .stat .d{font-size:12px;color:var(--accent);margin-top:4px;font-weight:600;}
  /* history */
  .hist h2{font-size:16px;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;}
  .hist h2 .cnt{font-size:13px;color:var(--sub);font-weight:500;}
  .daynav{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 4px 12px;}
  .daynav button{border:none;background:var(--card);color:var(--ink);border-radius:12px;
    width:42px;height:38px;font-size:20px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;}
  .daynav button:disabled{opacity:.35;cursor:default;}
  .daynav .dl{font-size:15px;font-weight:700;min-width:96px;text-align:center;cursor:pointer;text-decoration:underline dotted;}
  .daynav .today{font-size:13px;color:var(--accent);border:none;background:transparent;font-weight:700;cursor:pointer;padding:4px 8px;}
  .item{
    background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;
  }
  .badge{
    width:40px;height:40px;border-radius:12px;flex:none;display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
  }
  .badge.L{background:var(--L);} .badge.R{background:var(--R);} .badge.B{background:var(--B);}
  .badge.BTL{background:var(--BT);}
  .item .info{flex:1;min-width:0;}
  .item .time{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .item .meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .item .dur{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;}
  /* footer */
  .foot{display:flex;gap:12px;margin-top:26px;justify-content:center;}
  .foot button{
    border:none;background:transparent;color:var(--sub);font-size:13px;
    padding:8px 12px;cursor:pointer;text-decoration:underline;
  }
  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 14px;font-size:18px;}
  .modal p{margin:0 0 16px;font-size:14px;color:var(--sub);line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;}
  .field input,.field select,.tfield{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;
    font-size:17px;background:var(--bg);color:var(--ink);
    font-family:inherit;text-align:center;font-variant-numeric:tabular-nums;
  }
  .tfield{cursor:pointer;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:11px 0;border:1px solid var(--line);background:var(--bg);
    border-radius:12px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .mrow{display:flex;gap:10px;}
  .mrow .field{flex:1;}
  .detail-row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--sub);}
  .detail-row .v{font-weight:700;font-variant-numeric:tabular-nums;}
  .modal .acts{display:flex;gap:10px;margin-top:14px;}
  .modal .acts button{flex:1;padding:13px 0;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn-ok{background:var(--accent);color:#fff;}
  .btn-cancel{background:var(--line);color:var(--ink);}
  .btn-danger{background:#ff5a5a;color:#fff;}
  /* wheel picker */
  .wheels{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 4px;position:relative;}
  .wheel{height:200px;width:78px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;position:relative;}
  .wheel::-webkit-scrollbar{display:none;}
  .witem{height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;scroll-snap-align:center;color:var(--sub);}
  .witem.on{color:var(--accent-d);font-size:28px;font-weight:800;}
  .wpad{height:80px;}
  .wcolon{font-size:26px;font-weight:800;color:var(--ink);}
  .wsel{position:absolute;top:50%;left:8px;right:8px;height:40px;transform:translateY(-50%);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none;border-radius:8px;background:var(--accent-soft);}
  /* toast */
  #toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
    background:rgba(40,30,30,.92);color:#fff;padding:12px 20px;border-radius:14px;
    font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80%;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* hidden native date input for day picking */
  #dayPicker{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  /* 页面切换 + 底部导航 */
  .page{min-height:60vh;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;
    background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.10);border-top:1px solid var(--line);z-index:40;}
  .tabbar button{flex:1;border:none;background:transparent;color:var(--sub);padding:10px 0 12px;
    font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tabbar button .ic{font-size:21px;}
  .tabbar button.on{color:var(--accent);}
  /* 喂养页跳转卡片 */
  .growjump{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border-radius:var(--radius);padding:16px;margin:16px 0;box-shadow:var(--shadow);}
  .gj-left{display:flex;align-items:center;gap:12px;}
  .gj-ic{font-size:26px;}
  .gj-t{font-size:16px;font-weight:700;color:var(--ink);}
  .gj-s{font-size:12px;color:var(--sub);margin-top:2px;}
  /* 成长页卡片 */
  .card{background:var(--card);border-radius:var(--radius);padding:18px 16px;margin:16px 0;box-shadow:var(--shadow);}
  .card h2{font-size:16px;margin:0 0 12px;}
  .grow-summary{font-size:14px;color:var(--accent);font-weight:700;margin-bottom:12px;min-height:18px;}
  .chartwrap{position:relative;width:100%;}
  #growthChart{width:100%;display:block;}
  .legend{display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:13px;}
  .lg-w{color:var(--accent);} .lg-h{color:var(--L);}
  .btn-ok.full{width:100%;}
  /* 成长页：添加记录按钮更大更圆润 */
  #gAdd{font-size:17px;font-weight:800;padding:16px;margin-top:6px;border-radius:18px;letter-spacing:1px;}
  /* 成长记录翻页 */
  .pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;}
  .pager button{border:none;background:var(--line);color:var(--ink);border-radius:12px;
    padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;}
  .pager button:disabled{opacity:.4;cursor:default;}
  .pager .pginfo{font-size:13px;color:var(--sub);min-width:54px;text-align:center;}
  .gitem{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
  .gitem .info{flex:1;min-width:0;}
  .gitem .date{font-size:15px;font-weight:700;}
  .gitem .vals{font-size:13px;color:var(--sub);margin-top:2px;}
  .gitem .acts{display:flex;gap:8px;}
  .gitem .acts button{border:none;background:var(--line);color:var(--ink);border-radius:10px;
    padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;}
  .gitem .acts .del{background:#ff5a5a;color:#fff;}

  /* 宝宝信息卡（展示 + 头像） */
  .baby-head{display:flex;align-items:center;gap:14px;}
  .baby-avatar{width:62px;height:62px;border-radius:50%;flex:0 0 62px;overflow:hidden;
    background:var(--line);display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);cursor:pointer;position:relative;}
  .baby-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .baby-avatar .ph{font-size:32px;line-height:1;}
  .baby-main{flex:1;min-width:0;}
  .baby-name{font-size:18px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .baby-meta{font-size:13px;color:var(--sub);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .baby-edit{margin-left:auto;}
  /* 弹窗内头像编辑 */
  .avatar-pick{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px;}
  .avatar-pick .av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--line);
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);}
  .avatar-pick .av img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-pick .av .ph{font-size:42px;}
  .avatar-upload{border:1px dashed var(--line);color:var(--sub);background:transparent;
    border-radius:12px;padding:8px 14px;font-size:13px;cursor:pointer;}
  .avatar-upload:hover{color:var(--accent);border-color:var(--accent);}

</style>
</head>
<body>
<div class="wrap">
  <div class="page" id="pageFeed">
  <header>
    <div>
      <h1>喂养记录</h1>
      <div class="sub">轻触开始，记录每一次喂养</div>
    </div>
    <div class="topbtns">
      <button class="iconbtn" id="themeBtn" title="切换到夜间模式">🌙</button>
      <button class="iconbtn bottle" id="bottleBtn">🍼 瓶喂</button>
      <button class="iconbtn" id="addBtn">＋ 补记</button>
    </div>
  </header>

  <section class="timer">
    <div class="label" id="timerLabel">准备开始</div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="last" id="lastLine"></div>
    <div class="sides" id="sides">
      <div class="side" data-side="L">左<small>Left</small></div>
      <div class="side" data-side="R">右<small>Right</small></div>
      <div class="side" data-side="B">双侧<small>Both</small></div>
    </div>
    <div class="timerbtns">
      <button class="mainbtn" id="mainBtn">开始喂养</button>
      <div class="btnrow" id="activeBtns" style="display:none">
        <button class="subbtn" id="pauseBtn">暂停</button>
        <button class="subbtn stop" id="endBtn">结束喂养</button>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><div class="n" id="stTodayN">0</div><div class="t">今日次数</div><div class="d" id="stTodayD">0分</div></div>
    <div class="stat"><div class="n" id="stYesN">0</div><div class="t">昨日次数</div><div class="d" id="stYesD">0分</div></div>
    <div class="stat"><div class="n" id="stAllN">0</div><div class="t">总计次数</div><div class="d" id="stAllD">0分</div></div>
  </section>

  <section class="growjump" id="growJumpCard">
    <div class="gj-left"><span class="gj-ic">📈</span><div><div class="gj-t">宝宝成长</div><div class="gj-s">记录身高体重，查看成长曲线</div></div></div>
    <button class="iconbtn" id="gotoGrow">查看 →</button>
  </section>

  <section class="hist">
    <h2>喂养记录 <span class="cnt" id="histCnt"></span></h2>
    <div class="daynav">
      <button id="prevDay" aria-label="前一天">‹</button>
      <span class="dl" id="dayLabel">今天</span>
      <button id="nextDay" aria-label="后一天">›</button>
      <button class="today" id="todayBtn" style="display:none">回到今天</button>
    </div>
    <div id="histList"></div>
  </section>

  </div><!-- /pageFeed -->

  <div class="page" id="pageGrow" style="display:none">
    <header>
      <div>
        <h1>宝宝成长</h1>
        <div class="sub">记录身高体重，见证每一步</div>
      </div>
      <div class="topbtns">
        <button class="iconbtn" id="themeBtn2" title="切换到夜间模式">🌙</button>
      </div>
    </header>

    <section class="card">
      <div class="baby-head">
        <div class="baby-avatar" id="babyAvatarWrap" title="点击编辑宝宝信息">
          <img id="babyAvatar" alt="宝宝头像" style="display:none">
          <span class="ph" id="babyAvatarPh">👶</span>
        </div>
        <div class="baby-main">
          <div class="baby-name" id="babyDispName">宝宝</div>

<script>
const KEY = 'bf_sessions_v1';
const SIDE_NAME = {L:'左', R:'右', B:'双侧'};
let sessions = load();
// 根据上一次喂养的侧别，默认取相反侧（上次左→默认右，上次右→默认左，双侧/无→左）
function computeDefaultSide(){
  const done = sessions.filter(s=>s.type==='nurse' && s.end!==null).sort((a,b)=>a.end-b.end);
  if(!done.length) return 'L';
  const last = done[done.length-1].side;
  if(last==='L') return 'R';
  if(last==='R') return 'L';
  return 'L';
}
let selectedSide = computeDefaultSide();
let tick = null;
let viewDate = startOfDay(Date.now());
let editId = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(sessions)); }catch(e){ console.warn('save failed', e); } }
function getActive(){ return sessions.find(s => s.end === null) || null; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function isSameDay(a,b){ return startOfDay(a) === startOfDay(b); }

function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtHMS(ms){
  let s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return pad(h)+':'+pad(m)+':'+pad(s);
}
// 时长显示为「时分」 H:MM
function fmtHM(ms){
  const m = Math.max(0, Math.round(ms/60000));
  return Math.floor(m/60) + ':' + pad(m%60);
}
// 时长显示为「分秒」带单位，如 10分15秒；超过1小时则加「时」
function fmtMinSec(ms){
  let s = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  if(h>0) return h+'时'+m+'分'+s+'秒';
  return m+'分'+s+'秒';
}
function fmtClock(ts){
  const d = new Date(ts);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtDateCn(ts){
  const d = new Date(ts);
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
}
function fmtRelative(ts){
  const diff = Date.now() - ts;
  if(diff < 60000) return '刚刚';
  if(diff < 3600000) return Math.floor(diff/60000)+'分钟前';
  if(diff < 86400000) return Math.floor(diff/3600000)+'小时前';
  return Math.floor(diff/86400000)+'天前';
}
function netDuration(s){
  const end = s.end != null ? s.end : Date.now();
  let paused = s.pausedTotal || 0;
  if(s.end == null && s.pausedAt) paused += Date.now() - s.pausedAt;
  return Math.max(0, end - s.start - paused);
}
function liveElapsed(s){
  let paused = s.pausedTotal || 0;
  if(s.pausedAt) paused += Date.now() - s.pausedAt;
  return Math.max(0, Date.now() - s.start - paused);
}

/* ---------- 轻提示 / 确认弹窗 ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function confirmDialog(msg, onOk, title){
  document.getElementById('cfMsg').textContent = msg;
  document.getElementById('cfTitle').textContent = title || '确认';
  const ov = document.getElementById('confirmOverlay');
  ov.classList.add('show');
  const ok = document.getElementById('cfOk');
  const cancel = document.getElementById('cfCancel');
  ok.onclick = ()=>{ ov.classList.remove('show'); onOk(); };
  cancel.onclick = ()=>{ ov.classList.remove('show'); };
}

/* ---------- 滚轮时间选择器 ---------- */
let pickerApply = null;
function buildWheel(wheel, max){
  let html = '';
  for(let i=0;i<=max;i++) html += '<div class="witem" data-v="'+i+'">'+pad(i)+'</div>';
  wheel.innerHTML = '<div class="wpad"></div>'+html+'<div class="wpad"></div>';
  wheel.onscroll = ()=> markWheel(wheel, max);
}
function markWheel(wheel, max){
  const idx = Math.min(max, Math.max(0, Math.round(wheel.scrollTop/40)));
  wheel.querySelectorAll('.witem').forEach(el=>{
    el.classList.toggle('on', parseInt(el.dataset.v,10)===idx);
  });
}
function wheelVal(wheel, max){ return Math.min(max, Math.max(0, Math.round(wheel.scrollTop/40))); }
function setWheel(wheel, val){ wheel.scrollTop = val*40; }
function openPicker(initH, initM, apply){
  pickerApply = apply;
  const wh = document.getElementById('wheelH'), wm = document.getElementById('wheelM');
  document.getElementById('pickerOverlay').classList.add('show');
  // 弹窗显示后（有布局）再定位滚轮，保证高亮与选中带精确对齐
  requestAnimationFrame(()=>{
    setWheel(wh, initH); setWheel(wm, initM);
    markWheel(wh, 23); markWheel(wm, 59);
  });
}
buildWheel(document.getElementById('wheelH'), 23);
buildWheel(document.getElementById('wheelM'), 59);
document.getElementById('pCancel').addEventListener('click', ()=>document.getElementById('pickerOverlay').classList.remove('show'));
document.getElementById('pOk').addEventListener('click', ()=>{
  const h = wheelVal(document.getElementById('wheelH'),23);
  const m = wheelVal(document.getElementById('wheelM'),59);
  document.getElementById('pickerOverlay').classList.remove('show');
  if(pickerApply) pickerApply(h, m);
});

/* ---------- 渲染 ---------- */
function render(){
  renderTimer();
  renderStats();
  renderHistory();
}
/* 每秒刷新计时卡片：喂养中显示本次时长；空闲且有记录时显示距上次喂养的时长 */
function tickUpdate(){
  const clock = document.getElementById('clock');
  const active = getActive();
  if(active){
    clock.textContent = fmtHMS(liveElapsed(active));
  } else {
    const done = sessions.filter(s=>s.end!==null);
    if(done.length){
      const lastS = done[done.length-1];
      clock.textContent = fmtHMS(Date.now() - lastS.end);
    }
  }
}
function renderTimer(){
  const active = getActive();
  const label = document.getElementById('timerLabel');
  const clock = document.getElementById('clock');
  const last = document.getElementById('lastLine');
  const mainBtn = document.getElementById('mainBtn');
  const activeBtns = document.getElementById('activeBtns');
  const pauseBtn = document.getElementById('pauseBtn');
  const sides = document.getElementById('sides').children;
  const done = sessions.filter(s=>s.end!==null);

  if(!active){
    label.textContent = '准备开始';
    clock.textContent = '00:00:00';
    mainBtn.style.display = '';
    activeBtns.style.display = 'none';
    for(const el of sides){
      el.classList.toggle('on', el.dataset.side === selectedSide);
      el.style.pointerEvents = ''; el.style.opacity = '';
    }
    if(done.length){
      const lastS = done[done.length-1];
      label.textContent = '距上次喂养';
      clock.textContent = fmtHMS(Date.now() - lastS.end);
      last.textContent = '上次结束：' + fmtClock(lastS.end) + ' · 时长 ' + fmtMinSec(netDuration(lastS));
    } else {
      last.textContent = '还没有记录，开始第一次吧';
    }
  } else {
    mainBtn.style.display = 'none';
    activeBtns.style.display = 'flex';
    for(const el of sides){ el.classList.remove('on'); el.style.pointerEvents='none'; el.style.opacity='.5'; }

    if(active.pausedAt){
      label.textContent = '已暂停 · ' + SIDE_NAME[active.side];
      clock.textContent = fmtHMS(liveElapsed(active));
      pauseBtn.textContent = '继续';
      last.textContent = '暂停于 ' + fmtClock(active.pausedAt);
    } else {
      label.textContent = '喂养中 · ' + SIDE_NAME[active.side];
      clock.textContent = fmtHMS(liveElapsed(active));
      pauseBtn.textContent = '暂停';
      last.textContent = '开始于 ' + fmtClock(active.start);
    }
  }

  // 喂养中 或 空闲但已有记录（需实时显示距上次喂养）时保持每秒刷新
  const needTick = !!active || done.length > 0;
  if(needTick){ if(!tick) tick = setInterval(tickUpdate, 1000); }
  else { if(tick){ clearInterval(tick); tick = null; } }
}
function renderStats(){
  const done = sessions.filter(s=>s.end!==null);
  const today = done.filter(s=>isSameDay(s.end,Date.now()));
  const yes = done.filter(s=>isSameDay(s.end,Date.now()-86400000));
  const sum = arr => arr.reduce((a,s)=>a+netDuration(s),0);
  const durStr = ms => { const m=Math.round(ms/60000); return m<60 ? m+'分' : Math.floor(m/60)+'小时'+ (m%60? (m%60)+'分':''); };
  document.getElementById('stTodayN').textContent = today.length;
  document.getElementById('stTodayD').textContent = durStr(sum(today));
  document.getElementById('stYesN').textContent = yes.length;
  document.getElementById('stYesD').textContent = durStr(sum(yes));
  document.getElementById('stAllN').textContent = done.length;
  document.getElementById('stAllD').textContent = durStr(sum(done));
}
function renderHistory(){
  const list = document.getElementById('histList');
  const today0 = startOfDay(Date.now());
  let dl;
  if(viewDate === today0) dl = '今天';
  else if(viewDate === today0 - 86400000) dl = '昨天';
  else dl = fmtDateCn(viewDate);
  document.getElementById('dayLabel').textContent = dl;
  document.getElementById('prevDay').disabled = false;
  document.getElementById('nextDay').disabled = (viewDate >= today0);
  document.getElementById('todayBtn').style.display = (viewDate === today0) ? 'none' : '';

  const daySessions = sessions
    .filter(s => isSameDay(s.start, viewDate))
    .sort((a,b)=> b.start - a.start);

  document.getElementById('histCnt').textContent = daySessions.length ? ('共 '+daySessions.length+' 次') : '';
  if(!daySessions.length){
    list.innerHTML = '<div class="empty">这一天还没有记录<br>点击下方按钮开始喂养 🤱</div>';
    return;
  }
  let html = '';
  for(const s of daySessions){
    const isBottle = s.type === 'bottle';
    const active = s.end === null;
    let badge, timeStr, meta, durStr;
    if(isBottle){
      badge = '<div class="badge BTL">瓶</div>';
      timeStr = fmtClock(s.start);
      meta = '瓶喂 · ' + s.volume + 'ml';
      durStr = s.volume + 'ml';
    } else {
      badge = '<div class="badge '+s.side+'">'+s.side+'</div>';
      const sameDay = isSameDay(s.start, s.end == null ? Date.now() : s.end);
      timeStr = sameDay ? (fmtClock(s.start)+' – '+(active ? '进行中' : fmtClock(s.end)))
                         : (fmtClock(s.start)+' 起');
      const paused = (s.pausedTotal||0) + (s.pausedAt ? (Date.now()-s.pausedAt) : 0);
      meta = SIDE_NAME[s.side] + (paused>60000 ? ' · 含暂停'+fmtMinSec(paused) : '');
      durStr = active ? fmtMinSec(liveElapsed(s)) : fmtMinSec(netDuration(s));
    }
    html += '<div class="item" data-id="'+s.id+'">'
      + badge
      + '<div class="info"><div class="time">'+timeStr+'</div>'
      + '<div class="meta">'+meta+'</div></div>'
      + '<div class="dur">'+durStr+'</div>'
      + '</div>';
  }
  list.innerHTML = html;
}

/* ---------- 计时交互 ---------- */
document.getElementById('sides').addEventListener('click', e=>{
  const el = e.target.closest('.side'); if(!el || getActive()) return;
  selectedSide = el.dataset.side; buzz(15); renderTimer();
});
document.getElementById('mainBtn').addEventListener('click', ()=>{
  if(getActive()) return;
  sessions.push({id:uid(), type:'nurse', start:Date.now(), end:null, side:selectedSide, pausedTotal:0, pausedAt:null});
  buzz(30); save(); render();
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  const active = getActive(); if(!active) return;
  if(active.pausedAt){
    active.pausedTotal = (active.pausedTotal||0) + (Date.now() - active.pausedAt);
    active.pausedAt = null; buzz(20);
  } else {
    active.pausedAt = Date.now(); buzz(20);
  }
  save(); render();
});
document.getElementById('endBtn').addEventListener('click', ()=>{
  const active = getActive(); if(!active) return;
  if(active.pausedAt){
    active.pausedTotal = (active.pausedTotal||0) + (Date.now() - active.pausedAt);
    active.pausedAt = null;
  }
  active.end = Date.now();
  selectedSide = computeDefaultSide();
  buzz([20,40,20]); save(); render();
});

/* ---------- 时间字段绑定（点击唤起滚轮） ---------- */
// 每个时间字段维护一个 "HH:MM" 值，显示在 .tfield 上
const timeFields = {};
function bindTimeField(id, initH, initM){
  const el = document.getElementById(id);
  timeFields[id] = {h:initH, m:initM};
  el.textContent = pad(initH)+':'+pad(initM);
  el.addEventListener('click', ()=>{
    openPicker(timeFields[id].h, timeFields[id].m, (h,m)=>{
      timeFields[id].h = h; timeFields[id].m = m;
      el.textContent = pad(h)+':'+pad(m);
    });
  });
}
bindTimeField('mStartD', 9, 0);
bindTimeField('mEndD', 9, 15);
bindTimeField('bTimeD', 9, 0);
bindTimeField('eStartD', 9, 0);
bindTimeField('eEndD', 9, 15);

/* ---------- 补记（喂养） ---------- */
let mSide = 'L';
const overlay = document.getElementById('overlay');
function openModal(){
  const now = new Date();
  document.getElementById('mDate').value = fmtDate(now.getTime());
  timeFields['mStartD'].h = now.getHours(); timeFields['mStartD'].m = now.getMinutes();
  document.getElementById('mStartD').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  const end = new Date(now.getTime()+15*60000);

/* ---------- 白天 / 黑夜模式 ---------- */
const THEME_KEY = 'bf_theme';
function isNight(){
  const h = new Date().getHours();
  return (h < 7 || h >= 19);
}
function currentTheme(){
  const t = document.documentElement.dataset.theme;
  if(t==='dark' || t==='light') return t;
  return isNight() ? 'dark' : 'light';
}
function applyThemeMeta(theme){
  const dark = (theme === 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  const st = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(meta) meta.setAttribute('content', dark ? '#1f1a17' : '#fff5f3');
  if(st) st.setAttribute('content', dark ? 'black' : 'default');
}
/* 通知安卓原生状态栏/导航栏跟随主题（深色=暖黑底+浅色图标；浅色=粉底+深色图标） */
function syncNativeBars(){
  try{
    const b = window.AndroidBridge;
    if(!b || typeof b.setBarColors !== 'function') return;
    const dark = (currentTheme() === 'dark');
    if(dark) b.setBarColors('#1f1a17','#1f1a17', false);
    else b.setBarColors('#fff5f3','#fff5f3', true);
  }catch(e){}
}
function updateThemeBtn(){
  const t = currentTheme();
  const icon = (t === 'dark') ? '☀️' : '🌙';
  const title = (t === 'dark') ? '切换到白天模式' : '切换到夜间模式';
  const b1 = document.getElementById('themeBtn');
  const b2 = document.getElementById('themeBtn2');
  if(b1){ b1.textContent = icon; b1.title = title; }
  if(b2){ b2.textContent = icon; b2.title = title; }
}
function toggleTheme(){
  const next = (currentTheme() === 'dark') ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyThemeMeta(next);
  updateThemeBtn();
  syncNativeBars();
  buzz(12);
  // 主题色变了，重绘成长曲线（颜色取自 CSS 变量）
  if(document.getElementById('pageGrow').style.display !== 'none') drawGrowthChart();
}
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

function ageText(birthTs){
  const days = Math.floor((Date.now() - birthTs) / 86400000);
  if(days < 0) return '还未出生';
  if(days < 30) return '出生 ' + days + ' 天';
  const months = Math.floor(days / 30);
  const rem = days % 30;
  return months + ' 个月' + (rem ? (' ' + rem + ' 天') : '');
}
/* 宝宝信息：展示卡渲染（头像 / 姓名 / 月龄） */
function renderBabyInfo(){
  const img = document.getElementById('babyAvatar');

  const nameEl = document.getElementById('babyDispName');
  const metaEl = document.getElementById('babyDispMeta');
  if(babyInfo && babyInfo.avatar){
    img.src = babyInfo.avatar; img.style.display = ''; ph.style.display = 'none';
  } else {
    img.removeAttribute('src'); img.style.display = 'none'; ph.style.display = '';
  }
  nameEl.textContent = (babyInfo && babyInfo.name) ? babyInfo.name : '宝宝';
  if(babyInfo && (babyInfo.sex || babyInfo.birth)){
    let s = '';
    if(babyInfo.sex) s += (babyInfo.sex === 'M' ? '男' : '女');
    if(babyInfo.birth){
      const t = new Date(babyInfo.birth).getTime();
      if(!isNaN(t)) s += (s ? ' · ' : '') + ageText(t);
    }
    metaEl.textContent = s || '未填写出生信息';
  } else {
    metaEl.textContent = '未填写信息，点击右侧「编辑」';

}

function renderGrowth(){
  renderGrowList();
  drawGrowthChart();
}
let growPage = 1;
const GROW_PER_PAGE = 10;
function renderGrowList(){
  const list = document.getElementById('growList');
  const pager = document.getElementById('growPager');
  const sorted = growth.slice().sort((a,b)=>b.date - a.date);
  const total = sorted.length;
  const pages = Math.max(1, Math.ceil(total / GROW_PER_PAGE));
  if(growPage > pages) growPage = pages;
  document.getElementById('growCnt').textContent = total ? ('共 ' + total + ' 条') : '';
  if(!total){
    list.innerHTML = '<div class="empty">还没有成长记录<br>在上方添加体重 / 身高吧 📏</div>';
    pager.innerHTML = '';
    return;
  }
  const startIdx = (growPage - 1) * GROW_PER_PAGE;
  const pageItems = sorted.slice(startIdx, startIdx + GROW_PER_PAGE);
  let html = '';
  for(const r of pageItems){
    const d = new Date(r.date);
    const dateStr = (d.getMonth()+1) + '月' + d.getDate() + '日';
    const vals = [];
    if(r.weight != null) vals.push('体重 ' + r.weight + ' kg');
    if(r.height != null) vals.push('身高 ' + r.height + ' cm');
    html += '<div class="gitem" data-id="'+r.id+'">'
      + '<div class="info"><div class="date">'+dateStr+'</div>'
      + '<div class="vals">'+vals.join(' · ')+'</div></div>'
      + '<div class="acts"><button class="edit" data-id="'+r.id+'">修改</button>'
      + '<button class="del" data-id="'+r.id+'">删除</button></div></div>';
  }
  list.innerHTML = html;
  if(pages > 1){
    pager.innerHTML = '<button id="gpPrev"' + (growPage<=1 ? ' disabled' : '') + '>上一页</button>'
      + '<span class="pginfo">'+growPage+' / '+pages+'</span>'
      + '<button id="gpNext"' + (growPage>=pages ? ' disabled' : '') + '>下一页</button>';
  } else {
    pager.innerHTML = '';
  }
}
document.getElementById('growPager').addEventListener('click', e=>{
  if(e.target.id === 'gpPrev' && growPage > 1){ growPage--; renderGrowList(); }
  else if(e.target.id === 'gpNext'){ growPage++; renderGrowList(); }
});

  const delBtn = e.target.closest('.del');
  const editBtn = e.target.closest('.edit');

    }, '删除记录');
  } else if(editBtn){
    openGrowEdit(editBtn.dataset.id);
  }
});

  const r = growth.find(x=>x.id === growEditId); if(!r) return;
  const date = document.getElementById('geDate').value;
  if(!date){ toast('请选择日期'); return; }
  const w = parseFloat(document.getElementById('geWeight').value);
  const h = parseFloat(document.getElementById('geHeight').value);
  r.date = new Date(date + 'T00:00').getTime();
  r.weight = isNaN(w) ? null : w;
  r.height = isNaN(h) ? null : h;
  saveGrowth(); renderGrowth();
  document.getElementById('growEditOverlay').classList.remove('show');
  toast('已保存');
});

/* 导出 / 清空 / 导入（同时操纵喂养与成长两套数据） */
function downloadJSON(obj, filename){
  const json = JSON.stringify(obj, null, 2);
  if(window.AndroidBridge && window.AndroidBridge.exportData){
    window.AndroidBridge.exportData(json);
  } else {
    try{
      const blob = new Blob([json], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }catch(err){ toast('导出失败：'+err.message); }
  }
}
document.getElementById('exportAllBtn').addEventListener('click', ()=>{
  downloadJSON({ sessions: sessions, info: babyInfo, records: growth }, '喂养与成长_'+fmtDate(Date.now())+'.json');
});
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  confirmDialog('确定清空全部数据（喂养记录、成长记录、宝宝信息）？此操作不可恢复。', ()=>{
    sessions = []; selectedSide='L'; viewDate = startOfDay(Date.now()); save();
    growth = []; babyInfo = null; saveGrowth(); saveInfo();
    renderBabyInfo(); renderGrowth(); render();
    toast('已清空全部数据');
  }, '清空全部数据');
});
/* 导入：仅导入喂养记录（兼容旧版裸数组 / 新格式 {sessions}） */
document.getElementById('importBtn').addEventListener('click', ()=>{
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        let arr = null;
        if(Array.isArray(parsed)) arr = parsed;
        else if(parsed && Array.isArray(parsed.sessions)) arr = parsed.sessions;
        if(!arr || !arr.length){ toast('文件中没有可导入的喂养记录'); return; }
        const ids = new Set(sessions.map(s=>s.id));
        let added = 0;
        for(const s of arr){
          if(!s || s.start == null) continue;
          const id = s.id || uid();
          if(ids.has(id)) continue;
          ids.add(id);
          sessions.push(Object.assign({ id: id }, s));
          added++;
        }
        if(added){ save(); render(); toast('已导入 '+added+' 条喂养记录'); }
        else toast('没有新的喂养记录可导入');
      }catch(err){ toast('解析失败：'+err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
});

/* 成长曲线（Canvas，双轴：体重 kg / 身高 cm） */
function drawGrowthChart(){
  const cv = document.getElementById('growthChart');
  if(!cv) return;
  const wrap = cv.parentElement;
  const cssW = wrap.clientWidth || 320;
  const cssH = 240;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px';
  cv.style.height = cssH + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const cs = getComputedStyle(document.documentElement);
  const sub = (cs.getPropertyValue('--sub') || '#999').trim();
  const line = (cs.getPropertyValue('--line') || '#eee').trim();
  const accent = (cs.getPropertyValue('--accent') || '#ff7088').trim();
  const blue = (cs.getPropertyValue('--L') || '#5b8def').trim();

  const recs = growth.slice().sort((a,b)=>a.date - b.date);
  if(recs.length < 2){
    ctx.fillStyle = sub;
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('至少需要 2 条记录才能绘制成长曲线', cssW/2, cssH/2);
    return;
  }

  const padL = 38, padR = 42, padT = 16, padB = 28;
  const plotW = cssW - padL - padR;
  const plotH = cssH - padT - padB;
  const x0 = padL, y0 = padT;

  const weights = recs.map(r=>r.weight).filter(v=>v != null);
  const heights = recs.map(r=>r.height).filter(v=>v != null);
  const wPts = recs.map((r,i)=>({i, v:r.weight})).filter(p=>p.v != null);
  const hPts = recs.map((r,i)=>({i, v:r.height})).filter(p=>p.v != null);

  function yScale(val, mn, mx){
    if(mx === mn) return y0 + plotH/2;
    return y0 + plotH - (val - mn) / (mx - mn) * plotH;
  }
  function xAt(i){ return x0 + (recs.length === 1 ? 0 : i / (recs.length - 1) * plotW); }
  function range(vals){
    let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    const p = (mx - mn) * 0.15 || 1;
    return [mn - p, mx + p];
  }
  const wR = range(weights), hR = range(heights);

  // 网格 + 坐标轴标签
  const rows = 4;
  ctx.lineWidth = 1;
  ctx.font = '11px sans-serif';
  for(let g = 0; g <= rows; g++){
    const yy = y0 + plotH * g / rows;
    ctx.strokeStyle = line;
    ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x0 + plotW, yy); ctx.stroke();
    const wv = wR[1] - (wR[1] - wR[0]) * g / rows;
    ctx.fillStyle = accent; ctx.textAlign = 'right';
    ctx.fillText(wv.toFixed(1), x0 - 6, yy + 4);
    const hv = hR[1] - (hR[1] - hR[0]) * g / rows;
    ctx.fillStyle = blue; ctx.textAlign = 'left';
    ctx.fillText(hv.toFixed(0), x0 + plotW + 6, yy + 4);
  }
  // x 轴日期标签
  ctx.fillStyle = sub; ctx.textAlign = 'center';
  const xt = Math.min(recs.length, 5);
  for(let t = 0; t < xt; t++){
    const i = xt === 1 ? 0 : Math.round(t * (recs.length - 1) / (xt - 1));
    const d = new Date(recs[i].date);
    ctx.fillText((d.getMonth()+1) + '/' + d.getDate(), xAt(i), cssH - 8);
  }

  function drawLine(pts, mn, mx, color){
    if(pts.length < 1) return;
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach((p, idx)=>{
      const xx = xAt(p.i), yy = yScale(p.v, mn, mx);
      if(idx === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    });
    ctx.stroke();
    ctx.fillStyle = color;
    pts.forEach(p=>{
      const xx = xAt(p.i), yy = yScale(p.v, mn, mx);
      ctx.beginPath(); ctx.arc(xx, yy, 3.2, 0, Math.PI * 2); ctx.fill();
    });
  }
  drawLine(wPts, wR[0], wR[1], accent);
  drawLine(hPts, hR[0], hR[1], blue);
}
window.addEventListener('resize', ()=>{
  if(document.getElementById('pageGrow').style.display !== 'none') drawGrowthChart();
});
