name: Build APK

# 手动触发，或推送到 main/master 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可协议
        run: yes | sdkmanager --licenses || true

      - name: 安装 SDK 平台与构建工具
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 构建 Debug APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: breastfeed-tracker-apk
          path: app/build/outputs/apk/debug/*.apk
