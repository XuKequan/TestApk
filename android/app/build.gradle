plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.breastfeed'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.breastfeed'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 无额外依赖：仅使用系统 WebView 加载本地页面
}
