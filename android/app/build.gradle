plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.breastfeed'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.breastfeed'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile rootProject.file("signing-key.jks")
            storePassword "BfTrk!kq2026"
            keyAlias "breastfeed"
            keyPassword "BfTrk!kq2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 使用固定的签名密钥（CI 生成并持久化），保证覆盖安装升级时签名一致
            if (rootProject.file("signing-key.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 用固定签名密钥签署 debug 包：保留完整资源(图标等)，且升级时签名一致
            if (rootProject.file("signing-key.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 无额外依赖：仅使用系统 WebView 加载本地页面
}
